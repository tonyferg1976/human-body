<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body Atlas 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<style>
/* VOICE: curious, clinical, encouraging — an atlas for a future doctor
   IDEA: a hospital lightbox / x-ray viewer with a glass mannequin you can open up
   PICTURE: the rotatable 3D body itself, filling the centre of the screen
   COLOUR and TYPE: one fixed dark lightbox palette; system colours (bone, coral, red/blue, gold) carry meaning; Plex Sans + Plex Serif
   LAYOUT: parts list | 3D stage | notes panel; stacks to stage, notes, list on narrow screens */
:root{color-scheme:dark;--bg:#0e1417;--panel:#131b1f;--panel2:#182328;--line:#25343b;--ink:#e8efed;--mut:#9aaeac;--acc:#8fdcd2;
--org:#ff8f7a;--ske:#e9dfc7;--cir:#ef4b4b;--ner:#f6c945}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px max(2vw,14px);border-bottom:1px solid var(--line);background:var(--panel)}
.top h1{font:500 24px/1.1 "IBM Plex Serif",Georgia,serif;margin:0;letter-spacing:-.01em}
.top h1 small{display:block;font:400 13px/1.3 "IBM Plex Sans",sans-serif;color:var(--mut);margin-top:3px}
.layers{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:14px;transition:background .2s,border-color .2s,opacity .2s}
.chip i{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.chip[aria-pressed=false]{opacity:.5}.chip[aria-pressed=false] i{background:transparent;border:1.5px solid var(--c);box-shadow:none}
.chip[aria-pressed=true]{border-color:color-mix(in srgb,var(--c) 60%,var(--line));background:color-mix(in srgb,var(--c) 12%,var(--panel2))}
.quizbtn{--c:var(--acc)}
.app{display:grid;grid-template-columns:270px minmax(0,1fr) 380px;height:calc(100vh - 66px);min-height:560px}
.side,.info{overflow-y:auto;background:var(--panel)}
.side{border-right:1px solid var(--line);padding:14px}
.info{border-left:1px solid var(--line);padding:22px 24px 40px}
.search{width:100%;min-height:44px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
.grp h3{display:flex;align-items:center;gap:8px;font:600 13px/1.3 "IBM Plex Sans";color:var(--mut);margin:18px 0 6px}
.grp h3 i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.plist{list-style:none;margin:0;padding:0}
.plist button{display:block;width:100%;text-align:left;min-height:38px;padding:7px 10px;border:0;border-radius:8px;background:none;font-size:15px}
.plist button:hover{background:var(--panel2)}
.plist button[aria-current=true]{background:color-mix(in srgb,var(--acc) 16%,transparent);color:#fff}
.empty{color:var(--mut);font-size:14px;margin-top:16px}
.stage{position:relative;overflow:hidden;background:radial-gradient(ellipse 60% 70% at 50% 45%,#1c2c31 0%,#121b1f 55%,#0b1013 100%);touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.stage canvas.drag{cursor:grabbing}.stage canvas.hov{cursor:pointer}
.tip{position:absolute;pointer-events:none;padding:5px 10px;border-radius:8px;background:rgba(10,16,18,.88);border:1px solid var(--line);font-size:13px;white-space:nowrap;transform:translate(14px,-50%);opacity:0;transition:opacity .12s}
.pin{position:absolute;pointer-events:none;display:none}
.pin b{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;border:2px solid #fff;background:var(--pc,var(--acc));box-shadow:0 0 0 6px color-mix(in srgb,var(--pc,var(--acc)) 30%,transparent)}
.pin span{position:absolute;left:18px;top:-38px;padding:6px 12px;border-radius:10px;background:rgba(10,16,18,.9);border:1px solid var(--pc,var(--acc));font:500 15px/1.2 "IBM Plex Serif",serif;white-space:nowrap}
.pin span::before{content:"";position:absolute;left:-14px;top:30px;width:16px;border-top:1px solid var(--pc,var(--acc));transform:rotate(-40deg);transform-origin:right}
.views{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px}
.views button{min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(19,27,31,.85);font-size:14px}
.views button[aria-pressed=true]{border-color:var(--acc);color:var(--acc)}
.hint{position:absolute;right:12px;bottom:14px;font-size:13px;color:var(--mut);text-align:right;pointer-events:none}
.qbar{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:none;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px);padding:10px 16px;border-radius:14px;background:rgba(10,16,18,.92);border:1px solid var(--acc);font-size:16px}
.qbar.on{display:flex}.qbar b{font-family:"IBM Plex Serif",serif;font-weight:500;color:var(--acc);font-size:18px}
.qbar button{min-height:36px;padding:4px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:14px}
.qbar .sc{color:var(--mut);font-size:14px}
.qbar.ok{border-color:#5fd38a}.qbar.no{border-color:#ef7b6b}
.err{position:absolute;inset:auto 20px 50% 20px;text-align:center;color:var(--mut)}
.info h2{font:500 clamp(30px,3vw,40px)/1.05 "IBM Plex Serif",Georgia,serif;margin:4px 0 4px;text-wrap:balance}
.aka{font:italic 400 17px/1.4 "IBM Plex Serif",serif;color:var(--mut);margin:0 0 12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.tag{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);color:var(--c)}
.info h4{font:600 13px/1.3 "IBM Plex Sans";color:var(--acc);margin:20px 0 4px}
.info p{margin:0 0 6px;max-width:68ch}
.note{margin-top:20px;padding:14px 16px;border-radius:12px;background:var(--panel2);border-left:3px solid var(--acc)}
.note h4{margin-top:0}
.fact{border-left-color:var(--ner)}.fact h4{color:var(--ner)}
.rel{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rel button{min-height:36px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.rel button:hover{border-color:var(--acc)}
.back{min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:none;font-size:14px;color:var(--mut)}
.sys{display:grid;gap:10px;margin-top:18px}
.sys button{text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);border-left:4px solid var(--c)}
.sys button b{display:block;font:500 18px/1.2 "IBM Plex Serif",serif;margin-bottom:4px}
.sys button span{display:block;font-size:14px;color:var(--mut);line-height:1.45}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:12px}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.small{font-size:13px;color:var(--mut);margin-top:26px}
@media(max-width:1100px){
 .app{grid-template-columns:minmax(0,1fr);height:auto}
 .stage{height:62vh;min-height:380px;order:1}
 .info{order:2;border:0;border-top:1px solid var(--line)}
 .side{order:3;border:0;border-top:1px solid var(--line)}
 .layers{margin-left:0}
}
@media(max-width:600px){.hint{display:none}.top h1{font-size:21px}.chip{padding:6px 11px;font-size:13px}.info{padding:18px 16px 32px}}
@media(prefers-reduced-motion:reduce){.chip,.tip{transition:none}}
</style>
</head>
<body>
<header class="top">
 <h1>Body Atlas 3D<small>Tap any part to fly in and learn what it does</small></h1>
 <nav class="layers" id="layers" aria-label="Body systems"></nav>
</header>
<main class="app">
 <aside class="side" aria-label="Parts list">
  <input class="search" id="q" type="search" placeholder="Search parts, e.g. femur" aria-label="Search body parts">
  <div id="list"></div>
 </aside>
 <section class="stage" id="stage">
  <canvas id="cv" aria-label="3D model of the human body. Drag to rotate, scroll to zoom, click a part to select it."></canvas>
  <div class="tip" id="tip"></div>
  <div class="pin" id="pin"><b></b><span></span></div>
  <div class="qbar" id="qbar"></div>
  <div class="views">
   <button id="vFront">Front</button><button id="vBack">Back</button><button id="vSide">Side</button>
   <button id="vSpin" aria-pressed="true">Spin</button><button id="vSkin" aria-pressed="true">Skin outline</button>
  </div>
  <div class="hint">Drag to turn · scroll or pinch to zoom · right-drag to pan</div>
 </section>
 <article class="info" id="info" aria-live="polite"></article>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const SYS={
 organs:{name:'Organs',c:'#ff8f7a',v:'--org',about:'Organs are groups of tissues that work together on one big job: pumping, breathing, digesting, filtering or thinking.'},
 skeletal:{name:'Skeletal',c:'#e9dfc7',v:'--ske',about:'Adults have 206 bones (babies start with around 270 that fuse). Bones hold you up, protect organs, make blood cells in their marrow and store calcium.'},
 circulatory:{name:'Circulatory',c:'#ef4b4b',v:'--cir',about:'The heart, about 5 litres of blood and tens of thousands of kilometres of vessels. Red shows oxygen-rich blood, blue shows oxygen-poor blood — real blood is always red, just darker in veins.'},
 nervous:{name:'Nervous',c:'#f6c945',v:'--ner',about:'The brain and spinal cord (the central nervous system) plus nerves that reach every part of the body. Signals can travel at over 100 metres per second.'}
};

/* ---------- Content: what each part is, what it does, why doctors care ---------- */
const PARTS=[
// ORGANS
{id:'brain',name:'Brain (cerebrum)',aka:'Cerebrum',sys:['organs','nervous'],c:'#e8a9ae',
 what:'The largest part of the brain, split into left and right hemispheres. Its wrinkled outer layer, the cerebral cortex, holds billions of neurons.',
 does:'Thinking, memory, language, voluntary movement and making sense of everything your senses report. Each lobe specialises: frontal (planning and movement), parietal (touch and space), temporal (hearing and memory) and occipital (vision).',
 doc:'A stroke happens when blood supply to part of the brain is blocked or a vessel bleeds. Doctors teach the FAST check (Face, Arms, Speech, Time) because brain cells die quickly without blood.',
 fact:'The brain is about 2% of your body weight but uses roughly 20% of its energy at rest.',rel:['cerebellum','brainstem','skull','carotid']},
{id:'heart',name:'Heart',aka:'Cor',sys:['organs','circulatory'],c:'#c43b33',
 what:'A muscular pump about the size of a fist, behind the breastbone and tilted to the left. It has four chambers: two atria on top and two ventricles below.',
 does:'The right side pumps blood to the lungs to pick up oxygen; the left side pumps oxygen-rich blood to the whole body. Valves keep blood flowing one way, and the sinoatrial node, the heart’s natural pacemaker, sets the beat.',
 doc:'Doctors listen with a stethoscope for the "lub-dub" of valves closing, and an ECG records the heart’s electrical activity to spot rhythm problems and heart attacks.',
 fact:'It beats about 100,000 times a day — roughly 2.5 billion beats in a lifetime.',rel:['coronary','aorta','pulmonary','vena','vagus']},
{id:'lungs',name:'Lungs',aka:'Pulmones',sys:['organs'],c:'#e79aa3',
 what:'Two spongy organs filling most of the chest. The right lung has three lobes; the left has two, leaving room for the heart.',
 does:'Air flows down branching airways into hundreds of millions of tiny air sacs called alveoli. There, oxygen passes into the blood and carbon dioxide passes out to be breathed away.',
 doc:'Asthma narrows the airways; pneumonia fills alveoli with fluid. Doctors listen to breath sounds and measure oxygen with a clip on the finger (pulse oximeter).',
 fact:'Spread flat, the alveoli would cover roughly 70 square metres — about the floor of a small apartment.',rel:['trachea','pulmonary','ribs','heart']},
{id:'trachea',name:'Trachea',aka:'Windpipe',sys:['organs'],c:'#d8c2ad',
 what:'A tube about 10–12 cm long, held open by C-shaped rings of cartilage. It runs from the larynx (voice box) into the chest, where it splits into the left and right bronchi.',
 does:'Carries air to and from the lungs. Its lining makes mucus and has tiny hairs (cilia) that sweep dust and germs upward to be coughed out or swallowed.',
 doc:'In an emergency or for surgery, doctors can pass a breathing tube into the trachea (intubation) to keep the airway open.',
 fact:'The rings are open at the back so the oesophagus behind can bulge forward when you swallow a big mouthful.',rel:['lungs','oesophagus']},
{id:'oesophagus',name:'Oesophagus',aka:'Food pipe',sys:['organs'],c:'#d98a78',
 what:'A muscular tube about 25 cm long that runs from the throat, behind the trachea, through the diaphragm to the stomach.',
 does:'Waves of muscle squeezing (peristalsis) push food down — it even works upside down. A ring of muscle at the bottom stops stomach acid coming back up.',
 doc:'When that bottom valve is weak, acid causes heartburn (reflux). Long-term reflux can damage the lining, so doctors may look inside with a camera on a tube (endoscopy).',
 fact:'Swallowed food reaches your stomach in just a few seconds.',rel:['stomach','trachea']},
{id:'liver',name:'Liver',aka:'Hepar',sys:['organs'],c:'#8f3a2d',
 what:'The largest internal organ, about 1.5 kg, sitting under the right ribs.',
 does:'It has hundreds of jobs: processing nutrients from the gut, storing sugar as glycogen, making bile to digest fat, making proteins that help blood clot, and breaking down toxins and medicines.',
 doc:'Blood tests called liver function tests show how well it is working. Yellowing of the skin and eyes (jaundice) can be a sign of liver trouble.',
 fact:'It can regrow. A living person can donate part of their liver, and both pieces grow back close to full size.',rel:['stomach','pancreas','vena']},
{id:'stomach',name:'Stomach',aka:'Gaster',sys:['organs'],c:'#e3a07f',
 what:'A stretchy, J-shaped bag in the upper left of the abdomen.',
 does:'Stores food and churns it with strong acid and enzymes such as pepsin into a soupy mix called chyme, then releases it slowly into the small intestine.',
 doc:'Most stomach ulcers are caused by a bacterium, Helicobacter pylori, and can be cured with antibiotics.',
 fact:'Australian doctors Barry Marshall and Robin Warren proved the ulcer bacterium link — Marshall even drank the bacteria to test it — and won the 2005 Nobel Prize.',rel:['oesophagus','smallint','pancreas','vagus']},
{id:'pancreas',name:'Pancreas',aka:'',sys:['organs'],c:'#f0c27a',
 what:'A long, soft gland lying behind the stomach, with its head tucked into the curve of the small intestine.',
 does:'Two jobs: it sends digestive enzymes into the small intestine, and its islet cells release the hormones insulin and glucagon into the blood to keep blood sugar steady.',
 doc:'In type 1 diabetes the immune system destroys the insulin-making cells, so people need insulin injections or a pump for life.',
 fact:'Insulin was first given to a patient in 1922, in Toronto. Before that, type 1 diabetes was usually fatal.',rel:['stomach','smallint','liver']},
{id:'spleen',name:'Spleen',aka:'Lien',sys:['organs'],c:'#7c2d4c',
 what:'A fist-sized organ in the upper left abdomen, tucked behind the stomach and protected by the lower ribs.',
 does:'Filters the blood, removes old and damaged red blood cells, and stores white blood cells that fight some kinds of bacteria. It is part of the immune system.',
 doc:'A hard knock to the left side, such as a sports tackle, can rupture the spleen — a surgical emergency. People can live without one but need extra vaccinations.',
 fact:'It holds a reserve of blood cells that can be released when the body needs them.',rel:['stomach','ribs']},
{id:'kidneys',name:'Kidneys',aka:'Renes',sys:['organs'],c:'#9e3b3b',view:'back',
 what:'Two bean-shaped organs at the back of the abdomen, either side of the spine. The right one sits a little lower because the liver is above it.',
 does:'Each has about a million tiny filters (nephrons). Together they filter about 180 litres of blood plasma a day, keep water and salts balanced, help control blood pressure, and make a hormone that tells bone marrow to make red blood cells.',
 doc:'If kidneys fail, a dialysis machine can filter the blood instead, or a person can receive a transplant.',
 fact:'You can live a normal, healthy life with just one kidney.',rel:['bladder','aorta','vena']},
{id:'smallint',name:'Small intestine',aka:'Duodenum, jejunum and ileum',sys:['organs'],c:'#e6a6a0',
 what:'A coiled tube about 6–7 metres long, packed into the middle of the abdomen.',
 does:'Where most digestion and absorption happens. Its lining is covered in finger-like villi that give a huge surface for nutrients to pass into the blood.',
 doc:'In coeliac disease, gluten triggers the immune system to damage the villi. Doctors diagnose it with a blood test and a small tissue sample (biopsy).',
 fact:'Thanks to its folds and villi, its inner surface is around 30 square metres.',rel:['stomach','largeint','pancreas']},
{id:'largeint',name:'Large intestine',aka:'Colon',sys:['organs'],c:'#c98a68',
 what:'About 1.5 metres of wider tube that frames the small intestine: caecum (with the appendix), colon and rectum.',
 does:'Absorbs water and salts to turn liquid waste into faeces. Trillions of gut bacteria living here ferment fibre and make vitamin K.',
 doc:'Appendicitis is inflammation of the appendix. The classic sign is pain that starts near the belly button and moves to the lower right; it is often treated with surgery.',
 fact:'Your gut bacteria are roughly as many as all the human cells in your body.',rel:['smallint','bladder']},
{id:'bladder',name:'Bladder',aka:'Vesica urinaria',sys:['organs'],c:'#e2bf72',
 what:'A hollow, stretchy muscular bag low in the pelvis.',
 does:'Stores urine that drains from the kidneys through two tubes called ureters. Stretch sensors in its wall tell your brain when it is filling up.',
 doc:'Urinary tract infections are common. A quick dipstick test on a urine sample helps doctors check for infection.',
 fact:'A healthy adult bladder comfortably holds around 400–600 mL.',rel:['kidneys','pelvis']},
// SKELETAL
{id:'skull',name:'Skull',aka:'Cranium and mandible',sys:['skeletal'],c:'#efe6d2',op:.5,
 what:'22 bones: 8 form the cranium that encloses the brain, and 14 form the face, including the jaw (mandible).',
 does:'Protects the brain and eyes, holds the teeth, and anchors the muscles used for chewing and facial expression.',
 doc:'Babies have soft spots (fontanelles) between skull bones so the head can pass through birth and the brain can grow. Doctors check them at baby check-ups; they close by about age 2.',
 fact:'The jaw is the only skull bone you can move (apart from tiny bones inside the ear).',rel:['brain','spine']},
{id:'spine',name:'Spine',aka:'Vertebral column',sys:['skeletal'],c:'#e6dbc2',view:'back',
 what:'33 vertebrae: 7 in the neck (cervical), 12 in the chest (thoracic), 5 in the lower back (lumbar), plus the fused sacrum and coccyx. Cushioning discs sit between them.',
 does:'Holds you upright, protects the spinal cord, and lets you bend and twist. Its gentle S-shaped curve works like a spring to absorb shock.',
 doc:'Scoliosis is a sideways curve of the spine. Doctors screen for it by asking someone to bend forward and checking whether one side of the back sits higher.',
 fact:'Humans and giraffes both have seven neck vertebrae — a giraffe’s are just much longer.',rel:['spinalcord','ribs','pelvis','skull']},
{id:'ribs',name:'Rib cage',aka:'Costae',sys:['skeletal'],c:'#e9dfc7',
 what:'12 pairs of ribs. Pairs 1–7 attach to the breastbone by cartilage, 8–10 attach to the cartilage above, and 11–12 are "floating" with no front attachment.',
 does:'A protective cage around the heart, lungs, liver and spleen. Muscles between the ribs lift the cage to help you breathe in.',
 doc:'Broken ribs are painful mainly because every breath moves them. Doctors watch for a broken rib puncturing the lung underneath.',
 fact:'The bendy cartilage at the front lets your chest expand with every breath.',rel:['sternum','lungs','heart','spine']},
{id:'sternum',name:'Sternum',aka:'Breastbone',sys:['skeletal'],c:'#e9dfc7',
 what:'A flat, dagger-shaped bone at the front of the chest, in three parts: manubrium, body and xiphoid process.',
 does:'Anchors the ribs and collarbones and shields the heart.',
 doc:'In CPR, you push hard on the lower half of the sternum, squeezing the heart between the sternum and spine to keep blood moving. For open-heart surgery, surgeons split the sternum and wire it back together.',
 fact:'It contains red bone marrow, which makes blood cells throughout life.',rel:['ribs','heart','clavicle']},
{id:'clavicle',name:'Clavicle',aka:'Collarbone',sys:['skeletal'],c:'#e9dfc7',
 what:'A slender S-shaped bone running from the top of the sternum to the shoulder.',
 does:'Acts as a strut holding the shoulder out to the side, and is the only bony link between the arm and the trunk.',
 doc:'One of the most commonly broken bones, usually from falling onto an outstretched hand or the shoulder. Most heal well in a sling.',
 fact:'It is the first bone to start hardening in an unborn baby, around five weeks after conception.',rel:['scapula','sternum','humerus']},
{id:'scapula',name:'Scapula',aka:'Shoulder blade',sys:['skeletal'],c:'#e9dfc7',view:'back',
 what:'A flat, triangular bone on the upper back.',
 does:'Forms the shallow socket of the shoulder joint and anchors 17 muscles, including the rotator cuff that steadies the shoulder.',
 doc:'Rotator cuff tears are common in throwing and swimming sports, and in older adults. Doctors test them by checking strength in different arm movements.',
 fact:'It is held in place mostly by muscles — its only bony connection is through the collarbone.',rel:['clavicle','humerus']},
{id:'humerus',name:'Humerus',aka:'Upper arm bone',sys:['skeletal'],c:'#e9dfc7',
 what:'The long bone of the upper arm, from shoulder to elbow.',
 does:'Acts as a lever for the shoulder and elbow. The deltoid and biceps attach to it.',
 doc:'The "funny bone" is not a bone — it is the ulnar nerve running in a groove behind the bottom of the humerus. Bump it and it tingles.',
 fact:'Its name sounds like "humorous", which is why people joke about the funny bone.',rel:['radiusulna','scapula','armnerves']},
{id:'radiusulna',name:'Radius and ulna',aka:'Forearm bones',sys:['skeletal'],c:'#e9dfc7',
 what:'Two parallel forearm bones. The radius is on the thumb side; the ulna is on the little-finger side.',
 does:'They rotate around each other so you can turn your palm up (supination) or down (pronation).',
 doc:'A broken wrist at the end of the radius is one of the most common fractures, usually from falling onto an outstretched hand.',
 fact:'When you turn your palm down, your radius crosses over your ulna.',rel:['humerus','hand','armarteries']},
{id:'hand',name:'Hand bones',aka:'Carpals, metacarpals and phalanges',sys:['skeletal'],c:'#e9dfc7',
 what:'27 bones in each hand: 8 small carpals in the wrist, 5 metacarpals in the palm and 14 phalanges in the fingers.',
 does:'Their many joints allow both a powerful grip and very fine movements like writing or stitching a wound.',
 doc:'The scaphoid, a wrist bone, often breaks in falls and can hide on the first X-ray, so doctors check for tenderness in the hollow at the base of the thumb.',
 fact:'Your hands and feet together hold more than half of all the bones in your body.',rel:['radiusulna','armnerves']},
{id:'pelvis',name:'Pelvis',aka:'Hip bones, sacrum and coccyx',sys:['skeletal'],c:'#ece3cb',op:.6,
 what:'A bony basin made of two hip bones joined at the front, with the sacrum and coccyx at the back.',
 does:'Passes the weight of the upper body to the legs, protects the bladder and reproductive organs, and anchors powerful leg and trunk muscles.',
 doc:'The female pelvis is usually wider and rounder for childbirth, so forensic experts can use it to estimate whether a skeleton was male or female.',
 fact:'Each hip bone starts as three separate bones (ilium, ischium and pubis) that fuse in the teenage years.',rel:['femur','spine','bladder']},
{id:'femur',name:'Femur',aka:'Thigh bone',sys:['skeletal'],c:'#e9dfc7',
 what:'The longest and strongest bone in the body. Its ball-shaped head fits into the hip socket.',
 does:'Carries your body weight and, with powerful thigh muscles, drives walking, running and jumping.',
 doc:'Hip fractures — breaks of the femur’s neck — are serious in older people with weak bones (osteoporosis) and usually need surgery.',
 fact:'It is about a quarter of your height, so doctors and forensic scientists can estimate height from it.',rel:['pelvis','patella','tibiafibula','femart']},

   ...LR(s=>[[tube([[s*.066,1.302,-.006],[s*.035,1.292,0],[.022,1.292,.012]],.005,16),'#e0403f']])],
 coronary:()=>[tube(heartCurve(t=>[62-150*t,18-8*t]),.0022,40,6),tube(heartCurve(t=>[48,-12-130*t]),.0022,40,6),tube(heartCurve(t=>[48-60*t,-142-20*t]),.0022,24,6),tube(heartCurve(t=>[52,30+120*t]),.0022,40,6)],
 carotid:()=>LR(s=>[tube([s>0?[.026,1.415,.024]:[.008,1.415,.032],[s*.022,1.47,.026],[s*.028,1.55,.03],[s*.03,1.6,.006],[s*.025,1.65,0]],.0045,32)]),
 jugular:()=>LR(s=>[tube([[s*.042,1.625,-.005],[s*.044,1.54,.012],[s*.037,1.47,.022],[s>0?-.004:-.016,1.44,.03],[-.022,1.432,.03]],.0055,32)]),
 armarteries:()=>LR(s=>[tube([s>0?[.034,1.41,.01]:[.01,1.415,.032],[s*.07,1.45,.012],[s*.15,1.43,.0],[s*.2,1.39,0],[s*.235,1.25,.012],[s*.255,1.14,.012],[s*.28,1.0,.016],[s*.3,.89,.016],[s*.31,.85,.012]],.004,64)]),
 femart:()=>LR(s=>[tube([[.008,.995,.012],[s*.045,.952,.026],[s*.075,.9,.04],[s*.086,.78,.036],[s*.09,.62,.004],[s*.095,.52,-.03],[s*.095,.35,-.02],[s*.1,.12,0]],.0055,64)]),
 femvein:()=>LR(s=>[tube([[-.014,.992,.002],[s*.033,.948,.018],[s*.063,.9,.03],[s*.075,.78,.027],[s*.079,.62,-.006],[s*.083,.52,-.04],[s*.084,.35,-.03],[s*.088,.12,-.008]],.006,64)]),
 cerebellum:()=>[blob([0,1.632,-.05],[.046,.028,.034],{n:.05,f:22})],
 brainstem:()=>[tube([[0,1.67,-.02],[0,1.62,-.03],[0,1.565,-.036]],.011,16,12)],
 spinalcord:()=>{const pts=[];for(let y=1.575;y>=1.075;y-=.025)pts.push([0,y,spineZ(y)-.024]);const g=[tube(pts,.0058,64,8)];
   for(let k=-2;k<=2;k++)g.push(tube([[0,1.08,spineZ(1.08)-.024],[k*.004,1.0,spineZ(1.0)-.022],[k*.01,.95,-.07]],.0018,12,5));return g;},
 spinalnerves:()=>{const g=[];for(let i=0;i<12;i++)for(const s of[1,-1]){const pts=ribPts(i,s,.75,-.009,.006);pts.unshift([s*.006,pts[0][1]+.004,spineZ(pts[0][1])-.022]);g.push(tube(pts,.0022,30,5));}
   for(const y of[1.17,1.12,1.07,1.03])for(const s of[1,-1])g.push(tube([[s*.006,y,spineZ(y)-.022],[s*.04,y-.02,spineZ(y)-.005],[s*.075,y-.06,spineZ(y)+.02]],.0024,12,5));return g;},
 armnerves:()=>LR(s=>{const o=[[s*.012,1.5,spineZ(1.5)-.02],[s*.08,1.47,-.02],[s*.17,1.42,-.01]];return[
   tube([...o,[s*.215,1.3,.012],[s*.248,1.14,.018],[s*.275,1.0,.02],[s*.3,.88,.018],[s*.306,.82,.012]],.0028,64,6),
   tube([o[2],[s*.205,1.3,-.005],[s*.23,1.15,-.036],[s*.262,1.0,-.006],[s*.283,.88,.004],[s*.288,.8,.004]],.0028,48,6),
   tube([o[2],[s*.215,1.33,-.032],[s*.245,1.22,-.012],[s*.266,1.14,.008],[s*.296,1.0,.01],[s*.318,.88,.006]],.0028,48,6)];}),
 sciatic:()=>LR(s=>[tube([[s*.03,.985,spineZ(.985)],[s*.062,.93,-.072],[s*.09,.86,-.062],[s*.096,.7,-.046],[s*.096,.585,-.04]],.0055,32,8),
   tube([[s*.096,.585,-.04],[s*.095,.48,-.04],[s*.095,.3,-.03],[s*.09,.1,-.02]],.0036,32,6),tube([[s*.096,.585,-.04],[s*.115,.5,-.025],[s*.125,.45,0],[s*.115,.3,.02]],.003,24,6)]),
 vagus:()=>LR(s=>[tube([[s*.012,1.585,-.03],[s*.033,1.55,.012],[s*.036,1.47,.016],[s*.03,1.38,0],[s*.02,1.28,-.02],[s*.012,1.2,0],[s>0?.045:.02,1.15,.03]],.0024,48,6)])
};

/* ---- scene ---- */
const stage=$('#stage'),cv=$('#cv');
const renderer=new T3.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new T3.Scene(),camera=new T3.PerspectiveCamera(35,1,.01,50);
scene.add(new T3.HemisphereLight(0xe6f0ff,0x1a2226,.95));
const key=new T3.DirectionalLight(0xffffff,.85);key.position.set(1.5,3,2.5);scene.add(key);
const rim=new T3.DirectionalLight(0x9fd8ff,.55);rim.position.set(-2,1.5,-2.5);scene.add(rim);
const fill=new T3.DirectionalLight(0xffe2cc,.25);fill.position.set(-2,0,2);scene.add(fill);

const floor=new T3.Mesh(new T3.RingGeometry(.3,.305,96),new T3.MeshBasicMaterial({color:0x8fdcd2,transparent:true,opacity:.35}));
floor.rotation.x=-Math.PI/2;scene.add(floor);
const disc=new T3.Mesh(new T3.CircleGeometry(.3,64),new T3.MeshBasicMaterial({color:0x8fdcd2,transparent:true,opacity:.05,depthWrite:false}));disc.rotation.x=-Math.PI/2;disc.position.y=-.001;scene.add(disc);

const pick=[];
for(const p of PARTS){
 p.group=new T3.Group();p.mats=[];p.base=p.op||1;p.col=new T3.Color(p.c);
 for(let it of BUILD[p.id]()){let col=p.c;if(Array.isArray(it)){col=it[1];it=it[0];}
  const m=new T3.MeshStandardMaterial({color:col,roughness:.55,metalness:.05,transparent:true,opacity:p.base,depthWrite:p.base>.7});
  const mesh=new T3.Mesh(it,m);mesh.userData.p=p;p.group.add(mesh);p.mats.push(m);pick.push(mesh);}
 p.box=new T3.Box3().setFromObject(p.group);p.center=p.box.getCenter(V(0,0,0));
 scene.add(p.group);}

/* glass skin outline (fresnel) */
const skinU={c:{value:new T3.Color('#9fe3dc')},k:{value:1}};
const skinMat=new T3.ShaderMaterial({uniforms:skinU,transparent:true,depthWrite:false,
 vertexShader:'varying vec3 vN;varying vec3 vV;void main(){vec4 mv=modelViewMatrix*vec4(position,1.0);vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}',
 fragmentShader:'uniform vec3 c;uniform float k;varying vec3 vN;varying vec3 vV;void main(){float f=pow(1.0-abs(dot(normalize(vN),normalize(vV))),2.6);gl_FragColor=vec4(c,(f*0.55+0.012)*k);}'});
const skin=new T3.Group();
const torso=new T3.LatheGeometry([[.0001,.84],[.11,.85],[.165,.9],[.16,1.0],[.138,1.1],[.15,1.24],[.172,1.37],[.185,1.44],[.13,1.5],[.05,1.52]].map(a=>new T3.Vector2(a[0],a[1])),48);
torso.scale(1,1,.64);torso.computeVertexNormals();
const skinG=[torso,blob([0,1.665,.012],[.1,.125,.115]),limb([0,1.47,0],[0,1.585,.005],.05,.045),
 ...LR(s=>[blob(S(s),[.05,.05,.05]),limb(S(s),E(s),.044,.034),limb(E(s),W(s),.034,.024),blob([W(s)[0]+s*.012,W(s)[1]-.07,W(s)[2]+.004],[.036,.072,.016]),
  lathe(H(s).map((v,i)=>i===1?.95:v),K(s),t=>.083-.035*t+.012*Math.sin(Math.PI*t),32),lathe(K(s),[s*.095,.075,-.01],t=>.049-.024*t+.012*Math.sin(Math.PI*Math.min(1,t*1.6)),32),blob([s*.095,.03,.045],[.04,.03,.1])])];
for(const g of skinG){const m=new T3.Mesh(g,skinMat);m.renderOrder=10;skin.add(m);}
scene.add(skin);

/* ---- camera control ---- */
const cam={T:V(0,.93,0),r:3.0,th:0,ph:1.47};let tween=null,spin=true,lastUser=performance.now();
function placeCam(){const sp=Math.sin(cam.ph);camera.position.set(cam.T.x+cam.r*sp*Math.sin(cam.th),cam.T.y+cam.r*Math.cos(cam.ph),cam.T.z+cam.r*sp*Math.cos(cam.th));camera.lookAt(cam.T);}
function flyTo(T,r,th,ph,dur=1000){let d=((th-cam.th)%(2*Math.PI)+3*Math.PI)%(2*Math.PI)-Math.PI;
 tween={a:{T:cam.T.clone(),r:cam.r,th:cam.th,ph:cam.ph},b:{T,r,th:cam.th+d,ph},t0:performance.now(),dur:matchMedia('(prefers-reduced-motion: reduce)').matches?1:dur};}
const ease=t=>t<.5?4*t*t*t:1-((-2*t+2)**3)/2;
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
 camera.updateProjectionMatrix();if(!sel&&!tween)cam.r=fitR();}
const fitR=()=>{const a=camera.aspect||1;return Math.max(3.2,3.2*(.62/a));};
const ro=new ResizeObserver(resize);ro.observe(stage);

const ptrs=new Map();let down=null,pinch=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===1)down={x:e.clientX,y:e.clientY,moved:0,pan:e.button===2||e.shiftKey};
 if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y);}
 tween=null;stopSpin();});
cv.addEventListener('pointermove',e=>{
 const r=cv.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);hoverAt={x:e.clientX-r.left,y:e.clientY-r.top};needHover=true;
 if(!ptrs.has(e.pointerId))return;const prev=ptrs.get(e.pointerId),dx=e.clientX-prev.x,dy=e.clientY-prev.y;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)cam.r=Math.min(6,Math.max(.22,cam.r*pinch/d));pinch=d;panBy(dx*.5,dy*.5);if(down)down.moved=99;return;}
 if(!down)return;down.moved+=Math.abs(dx)+Math.abs(dy);if(down.moved>4)cv.classList.add('drag');
 if(down.pan)panBy(dx,dy);else{cam.th-=dx*.008;cam.ph=Math.min(2.9,Math.max(.25,cam.ph-dy*.006));}});
function panBy(dx,dy){const right=V(0,0,0).setFromMatrixColumn(camera.matrix,0),up=V(0,0,0).setFromMatrixColumn(camera.matrix,1),k=cam.r*.0011;
 cam.T.addScaledVector(right,-dx*k).addScaledVector(up,dy*k);}
function endPtr(e){ptrs.delete(e.pointerId);cv.classList.remove('drag');if(ptrs.size<2)pinch=0;
 if(down&&ptrs.size===0){if(down.moved<6&&e.type==='pointerup')clickPick();down=null;}}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',()=>{hoverAt=null;setHover(null);});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();tween=null;stopSpin();cam.r=Math.min(6,Math.max(.22,cam.r*Math.exp(e.deltaY*.0012)));},{passive:false});
function stopSpin(){lastUser=performance.now();}

/* ---- state, picking, styles ---- */
const layers={organs:true,skeletal:true,circulatory:true,nervous:true};
let sel=null,hover=null,needHover=false,hoverAt=null,showSkin=true;
const ray=new T3.Raycaster(),mouse=new T3.Vector2();
const shown=p=>p.sys.some(s=>layers[s]);
function hitPart(){ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(pick.filter(m=>m.userData.p.group.visible),false);
 if(!hits.length)return null;if(sel&&hits.some(h=>h.object.userData.p===sel))return sel;return hits[0].object.userData.p;}
function setHover(p){if(p===hover)return;hover=p;cv.classList.toggle('hov',!!p);const tip=$('#tip');
 if(p&&!quiz.on){tip.textContent=p.name;tip.style.opacity=1;}else tip.style.opacity=0;}
function clickPick(){const p=hitPart();if(quiz.on){if(p)answer(p);return;}if(p)select(p);else if(sel)select(null);}
function styles(){for(const p of PARTS){p.group.visible=shown(p);const ghost=sel&&p!==sel;
 for(const m of p.mats){m.opacity=ghost?.07:p.base;m.depthWrite=!ghost&&p.base>.7;}}
 skin.visible=showSkin;skinU.k.value=sel?.45:1;}

function select(p,fly=true){
 if(p&&!shown(p)){layers[p.sys[0]]=true;renderLayers();}
 sel=p;styles();renderList();renderInfo();
 const pin=$('#pin');if(p){pin.style.display='block';pin.style.setProperty('--pc',p.c);pin.querySelector('span').textContent=p.name;}else pin.style.display='none';
 if(!fly)return;
 if(p){const size=p.box.getSize(V(0,0,0)).length()/2,r=Math.max(.3,size/Math.sin(camera.fov*Math.PI/360)*1.05);
  const side=Math.max(-.55,Math.min(.55,p.center.x*3));flyTo(p.center.clone(),Math.min(r,3),p.view==='back'?Math.PI-side:side,1.4);}
 else flyTo(V(0,.93,0),fitR(),cam.th,1.47);}

/* ---- UI: layers, list, info ---- */
function renderLayers(){$('#layers').innerHTML=Object.entries(SYS).map(([k,s])=>`<button class="chip" data-l="${k}" aria-pressed="${layers[k]}" style="--c:var(${s.v})"><i></i>${s.name}</button>`).join('')+
 `<button class="chip quizbtn" id="quizBtn" aria-pressed="${quiz.on}"><i></i>${quiz.on?'Stop quiz':'Quiz me'}</button>`;}
$('#layers').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='quizBtn'){quiz.on?stopQuiz():startQuiz();return;}
 const k=b.dataset.l;layers[k]=!layers[k];if(sel&&!shown(sel))select(null);else{styles();}renderLayers();renderList();if(!sel)renderInfo();});

function renderList(){const q=$('#q').value.trim().toLowerCase();let html='',any=false;
 for(const [k,s] of Object.entries(SYS)){if(!layers[k])continue;
  const items=PARTS.filter(p=>p.sys.includes(k)&&(!q||(p.name+' '+p.aka).toLowerCase().includes(q)));if(!items.length)continue;any=true;
  html+=`<div class="grp"><h3 style="--c:var(${s.v})"><i></i>${s.name} · ${items.length}</h3><ul class="plist">${items.map(p=>`<li><button data-id="${p.id}" aria-current="${sel===p}">${p.name}</button></li>`).join('')}</ul></div>`;}
 $('#list').innerHTML=any?html:'<p class="empty">No parts match. Try another word, or switch on more systems above.</p>';}
$('#list').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b&&!quiz.on)select(byId[b.dataset.id]);});
$('#q').addEventListener('input',renderList);

function renderInfo(){const el=$('#info');
 if(!sel){el.innerHTML=`<h2>Explore the human body</h2><p class="aka">A 3D atlas for future doctors</p>
  <p>Drag to turn the body, scroll or pinch to zoom, and tap any part to fly in. Switch systems on and off at the top to peel back the layers.</p>
  <div class="sys">${Object.entries(SYS).map(([k,s])=>`<button data-sys="${k}" style="--c:var(${s.v})"><b>${s.name} · ${PARTS.filter(p=>p.sys.includes(k)).length} parts</b><span>${s.about}</span></button>`).join('')}</div>
  <div class="legend"><span><i style="background:#e0403f"></i>Oxygen-rich blood</span><span><i style="background:#3f7fe0"></i>Oxygen-poor blood</span></div>
  <p class="small">For learning, not medical advice. The 3D model is simplified: shapes, sizes and positions are approximate.</p>`;return;}
 const p=sel;el.innerHTML=`<button class="back" id="backBtn">← Whole body</button>
  <h2>${p.name}</h2>${p.aka?`<p class="aka">${p.aka}</p>`:''}
  <div class="tags">${p.sys.map(s=>`<span class="tag" style="--c:var(${SYS[s].v})">${SYS[s].name}</span>`).join('')}</div>
  <h4>What it is</h4><p>${p.what}</p><h4>What it does</h4><p>${p.does}</p>
  <div class="note"><h4>Why doctors care</h4><p>${p.doc}</p></div>
  <div class="note fact"><h4>Did you know?</h4><p>${p.fact}</p></div>
  <h4>Connected parts</h4><div class="rel">${p.rel.map(id=>`<button data-id="${id}">${byId[id].name}</button>`).join('')}</div>
  <p class="small">For learning, not medical advice. The 3D model is simplified.</p>`;}
$('#info').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='backBtn')select(null);else if(b.dataset.id&&!quiz.on)select(byId[b.dataset.id]);
 else if(b.dataset.sys){const k=b.dataset.sys;for(const s in layers)layers[s]=s===k;renderLayers();styles();renderList();renderInfo();}});

/* ---- views ---- */
$('#vFront').onclick=()=>{stopSpin();flyTo(sel?sel.center.clone():V(0,.93,0),sel?cam.r:fitR(),0,1.47);};
$('#vBack').onclick=()=>{stopSpin();flyTo(sel?sel.center.clone():V(0,.93,0),sel?cam.r:fitR(),Math.PI,1.47);};
$('#vSide').onclick=()=>{stopSpin();flyTo(sel?sel.center.clone():V(0,.93,0),sel?cam.r:fitR(),Math.PI/2,1.47);};
$('#vSpin').onclick=e=>{spin=!spin;e.currentTarget.setAttribute('aria-pressed',spin);lastUser=0;};
$('#vSkin').onclick=e=>{showSkin=!showSkin;e.currentTarget.setAttribute('aria-pressed',showSkin);styles();};
addEventListener('keydown',e=>{if(e.key==='Escape'&&sel&&!quiz.on)select(null);});

/* ---- quiz ---- */
const quiz={on:false,t:null,score:0,n:0,tries:0};
function qbar(html,cls=''){const b=$('#qbar');b.className='qbar on '+cls;b.innerHTML=html+`<span class="sc">Score ${quiz.score}/${quiz.n}</span>`;}
function startQuiz(){quiz.on=true;quiz.score=0;quiz.n=0;renderLayers();nextQ();}
function stopQuiz(){quiz.on=false;$('#qbar').className='qbar';renderLayers();select(null);}
function nextQ(){const pool=PARTS.filter(p=>shown(p)&&p!==quiz.t);if(!pool.length){qbar('Switch on a body system to play.');return;}
 quiz.t=pool[Math.floor(Math.random()*pool.length)];quiz.tries=0;quiz.n++;select(null);setHover(null);
 qbar(`Find the <b>${quiz.t.name}</b><button data-q="skip">Skip</button>`);}
function answer(p){if(!quiz.t)return;
 if(p===quiz.t){quiz.score++;select(p);quiz.t=null;qbar(`Correct — that’s the <b>${p.name}</b><button data-q="next">Next</button>`,'ok');return;}
 quiz.tries++;if(quiz.tries>=3){const t=quiz.t;select(t);quiz.t=null;qbar(`Here it is: the <b>${t.name}</b><button data-q="next">Next</button>`,'no');return;}
 qbar(`That’s the ${p.name}. Find the <b>${quiz.t.name}</b> (${3-quiz.tries} tries left)<button data-q="skip">Skip</button>`,'no');}
$('#qbar').addEventListener('click',e=>{const b=e.target.closest('button[data-q]');if(!b)return;if(b.dataset.q==='skip'&&quiz.t){const t=quiz.t;quiz.t=null;select(t);qbar(`That was the <b>${t.name}</b><button data-q="next">Next</button>`,'no');}else nextQ();});

/* ---- loop ---- */
const tip=$('#tip'),pinEl=$('#pin'),v=V(0,0,0);
function frame(now){
 if(tween){const k=ease(Math.min(1,(now-tween.t0)/tween.dur)),a=tween.a,b=tween.b;cam.T.lerpVectors(a.T,b.T,k);cam.r=lerp(a.r,b.r,k);cam.th=lerp(a.th,b.th,k);cam.ph=lerp(a.ph,b.ph,k);if(k>=1)tween=null;}
 else if(spin&&!sel&&!quiz.on&&!ptrs.size&&now-lastUser>4000)cam.th+=.0025;
 placeCam();
 if(needHover&&!ptrs.size){needHover=false;setHover(hoverAt?hitPart():null);}
 if(hover&&hoverAt){tip.style.left=hoverAt.x+'px';tip.style.top=hoverAt.y+'px';}
 const pulse=.22+.16*Math.sin(now/260);
 for(const p of PARTS){const e=p===sel?pulse:(p===hover&&!quiz.on?.28:0);for(const m of p.mats)m.emissive.copy(p.col).multiplyScalar(e);}
 if(sel){v.copy(sel.center).project(camera);if(v.z<1){pinEl.style.display='block';pinEl.style.left=((v.x+1)/2*stage.clientWidth)+'px';pinEl.style.top=((1-v.y)/2*stage.clientHeight)+'px';}else pinEl.style.display='none';}
 renderer.render(scene,camera);requestAnimationFrame(frame);}

renderLayers();renderList();renderInfo();styles();resize();cam.r=fitR();placeCam();requestAnimationFrame(frame);
}
}
</script>
</body>
</html>
